services:
  - type: web
    name: sigmalytic-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"
      - key: SIGMALYTIC_NIGHTLY_CRON_ENABLED
        value: "true"
      - key: SIGMALYTIC_NIGHTLY_CRON_TOKEN
        sync: false

  - type: web
    name: sigmalytic-frontend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        fromService:
          name: sigmalytic-backend
          type: web
          property: url
      - key: BACKEND_WS_URL
        value: "wss://sigmalytic-backend.onrender.com"

  - type: cron
    name: sigmalytic-nightly-campaign-refresh
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_nightly_campaign_refresh.py
    schedule: "15 22 * * MON-FRI"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        fromService:
          name: sigmalytic-backend
          type: web
          property: url
      - key: SIGMALYTIC_NIGHTLY_CRON_ENABLED
        value: "true"
      - key: SIGMALYTIC_NIGHTLY_CRON_TOKEN
        sync: false
      - key: SIGMALYTIC_NIGHTLY_CRON_MAX_SYMBOLS
        value: "1500"
      - key: SIGMALYTIC_NIGHTLY_CRON_BAR_LIMIT
        value: "252"
      - key: SIGMALYTIC_NIGHTLY_CRON_TIMEFRAME
        value: "DAILY"
      - key: SIGMALYTIC_NIGHTLY_CRON_TIMEOUT_SECONDS
        value: "900"

