services:
  - type: web
    name: sigmalytic-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"

  - type: web
    name: sigmalytic-frontend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        fromService:
          name: sigmalytic-backend
          type: web
          property: url
      - key: BACKEND_WS_URL
        value: "wss://sigmalytic-backend.onrender.com"
