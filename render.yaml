services:
  - type: web
    name: sigmalytic-backend
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    # IMPORTANT (2026-08-06): workers MUST stay at 1. Confirmed root
    # cause of a real production OOM crash after briefly trying
    # --workers 2: campaign_api.py's _cached_endpoint_result() uses a
    # module-level, in-process-only cache + per-key threading.Lock to
    # prevent concurrent requests from each independently running the
    # same ~400-1000MB active_campaigns/rankings/status computation at
    # once (a "thundering herd" bug already found and fixed once
    # before, in an earlier session). That lock is a plain Python
    # object -- it is NOT shared across separate Gunicorn worker
    # processes. With 2+ workers, each has its own independent cache
    # and lock, so two workers can each independently run the same
    # heavy computation at the same time, defeating the existing
    # protection entirely and reproducing the exact OOM crash that
    # protection was built to prevent. A genuine multi-worker fix
    # would require moving this cache/lock to something shared across
    # processes (e.g. Redis), not just raising the worker count.
    startCommand: gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --workers 1 --max-requests 75 --max-requests-jitter 20 --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"
      - key: SIGMALYTIC_NIGHTLY_CRON_ENABLED
        value: "true"
      - key: SIGMALYTIC_NIGHTLY_CRON_TOKEN
        sync: false

  - type: web
    name: sigmalytic-frontend
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend/app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"
      - key: BACKEND_WS_URL
        value: "wss://sigmalytic-backend.onrender.com"

  - type: worker
    name: sigmalytic-radar-scanner
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_radar_scanner_worker.py
    # NOTE: this service also needs SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
    # (or SUPABASE_ANON_KEY), REDIS_URL, and RESEND_API_KEY set manually in
    # Render's dashboard -- same as the backend service, which doesn't
    # track those here either (they were set directly in the dashboard,
    # not via this file). Copy the same values this service already uses.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"

  - type: cron
    name: sigmalytic-nightly-campaign-refresh
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_nightly_campaign_refresh.py
    schedule: "15 22 * * MON-FRI"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"
      - key: SIGMALYTIC_NIGHTLY_CRON_MAX_SYMBOLS
        value: "1500"
      - key: SIGMALYTIC_NIGHTLY_CRON_BAR_LIMIT
        value: "252"
      - key: SIGMALYTIC_NIGHTLY_CRON_TIMEFRAME
        value: "DAILY"
      # NOTE (2026-08-06): SIGMALYTIC_NIGHTLY_CRON_ENABLED, _TOKEN, and
      # _TIMEOUT_SECONDS were removed from here -- confirmed via direct
      # search that tools/render_nightly_campaign_refresh.py (this
      # service's actual script) never reads any of them. All three
      # were leftover from the old, replaced HTTP-based design
      # described in that script's own docstring (it used to POST to
      # backend's /api/admin/run-full-nightly and poll for completion;
      # this service now runs the pipeline directly in its own process
      # instead). The backend service's own copies of ENABLED/TOKEN are
      # NOT removed -- that old endpoint still genuinely exists in
      # main.py and still reads them, even though this cron no longer
      # calls it.

  - type: cron
    name: sigmalytic-daily-report
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_daily_report_generator.py
    # Scheduled 30 minutes after sigmalytic-nightly-campaign-refresh
    # (22:15 UTC) so the report reflects that day's freshly-refreshed
    # campaign data, not the previous day's.
    schedule: "45 22 * * MON-FRI"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SIGMALYTIC_BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"

