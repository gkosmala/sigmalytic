services:
  - type: web
    name: sigmalytic-backend
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    # HISTORY (2026-08-06): a production OOM crash was traced to
    # campaign_api.py's _cached_endpoint_result() using a plain,
    # module-level, in-process-only Python dict + lock -- with 2+
    # gunicorn workers, each had its own independent copy, so two
    # workers could each independently run the same ~400-1000MB
    # computation at once, defeating the single-flight protection that
    # function was built to provide. Root-caused and genuinely fixed by
    # porting the already-proven, Redis-backed, multi-process-safe
    # cache pattern from frontend/shared_cache.py into a new backend/
    # shared_cache.py, and rewiring _cached_endpoint_result() to use
    # it -- verified with real concurrency tests, including the exact
    # "N callers racing on the same key produce exactly 1 real
    # computation" scenario. 2 workers re-enabled only after that fix
    # was confirmed. If this is ever suspected of causing memory
    # issues again, verify the shared_cache fix itself first --
    # reverting to 1 worker should be a last resort, not the default
    # response to any future memory concern.
    startCommand: gunicorn backend.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --max-requests 75 --max-requests-jitter 20 --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"
      - key: SIGMALYTIC_NIGHTLY_CRON_ENABLED
        value: "true"
      - key: SIGMALYTIC_NIGHTLY_CRON_TOKEN
        sync: false

  - type: web
    name: sigmalytic-frontend
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    # UPDATE (2026-08-06): migrated from a direct `python frontend/
    # app.py` invocation (Flask/Werkzeug's built-in dev server, with
    # no periodic recycling at all) to gunicorn, given a confirmed,
    # recurring (~hourly) OOM crash whose exact root cause has not
    # been definitively proven from static code analysis alone.
    # `server = app.server` already existed in app.py (the standard
    # Dash pattern exposing the real underlying Flask app), making
    # this a clean migration with no changes needed to app.py's own
    # logic. Deliberately conservative: workers=1 (not reintroducing
    # the multi-process risk that caused the backend's earlier OOM
    # crash tonight, without first understanding this app's own
    # thread/process-safety). The real, valuable protection here is
    # --max-requests: periodic worker recycling clears any
    # accumulated memory regardless of the exact leak cause, the same
    # real, working safety net already proven on the backend tonight.
    # Real memory diagnostic logging (added moments ago) remains in
    # place to find the actual, definitive root cause in parallel.
    # FIX (2026-08-06): --timeout 120 was a real bug I introduced with
    # this migration -- confirmed 7 different frontend callbacks
    # (Generate Report, Symbol Backtest, and others) have their own
    # internal timeout=180 for waiting on backend calls. With gunicorn
    # at 120, any of these genuinely taking 120-180s would get its
    # worker killed mid-request by gunicorn itself, causing a 502 --
    # the exact same bug class already found and fixed for the
    # backend's own gunicorn timeout earlier tonight. Raised to 240s
    # to safely exceed all seven of these callbacks' own timeouts.
    # URGENT (2026-08-06): --max-requests 150 did NOT stop the crash --
    # confirmed via a full day's deploy log showing continued OOM
    # every ~15-40 min for 12+ hours even with this recycling active.
    # This means the leak is severe enough to hit the 2GB ceiling
    # BEFORE a worker completes 150 requests -- the OOM kill happens
    # before recycling ever gets a chance to help at all. Lowered
    # drastically to force much more frequent recycling as an
    # immediate stopgap. This is not a fix for the actual root cause,
    # which is still not identified -- it's damage control while real
    # evidence (the [MEM] diagnostic logs already in place) is used to
    # find it directly.
    # UPDATE (2026-08-07): incremental increase from the emergency
    # stopgap (20) to 50 -- deliberately NOT a full revert to the
    # previously-failed 150. Two things changed since 20 was set: real
    # [MEM] evidence confirmed genuine stability (84-96 MB, flat) at
    # the aggressive setting, and the CallbackException this frequent
    # recycling was partly aggravating now has a real auto-reload fix.
    #
    # FIX (2026-08-27): the diagnostic above concluded successfully --
    # memory is genuinely stable, not leaking -- so the aggressive
    # 50-request recycling this comment describes no longer serves any
    # remaining purpose. Confirmed directly via live production logs
    # that this setting (combined with --workers 1, meaning there is
    # no second worker to cover a gap) was causing real, recurring
    # user-facing 502s: every worker restart showed a fresh on_tick
    # sequence (seq=0) whose first call failed immediately, and
    # restarts were visibly happening every 5-10 seconds under normal
    # traffic. Raised to a value in line with typical production
    # Gunicorn configurations (many real-world configs use 1000-10000+
    # for this exact setting) -- still recycles periodically as a
    # general safety net, just no longer aggressively enough to be the
    # dominant source of restarts under ordinary load.
    startCommand: gunicorn frontend.app:server --workers 1 --max-requests 1000 --max-requests-jitter 200 --bind 0.0.0.0:$PORT --timeout 240
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"
      - key: BACKEND_WS_URL
        value: "wss://sigmalytic-backend.onrender.com"

  - type: worker
    name: sigmalytic-alpaca-stream
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_alpaca_stream_worker.py
    # Deliberately its own separate worker service, not folded into
    # sigmalytic-radar-scanner -- see that script's own module docstring
    # for the full reasoning (mixing this lightweight, always-on,
    # latency-sensitive stream with that service's heavy periodic
    # batch scans risks the same class of memory/stability problem
    # that already motivated splitting the scanner out from the main
    # backend in the first place).
    # NOTE: also needs REDIS_URL set manually in Render's dashboard,
    # same as sigmalytic-backend and sigmalytic-radar-scanner (not
    # tracked here, per those services' own existing convention).
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false

  - type: worker
    name: sigmalytic-radar-scanner
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_radar_scanner_worker.py
    # NOTE: this service also needs SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
    # (or SUPABASE_ANON_KEY), REDIS_URL, and RESEND_API_KEY set manually in
    # Render's dashboard -- same as the backend service, which doesn't
    # track those here either (they were set directly in the dashboard,
    # not via this file). Copy the same values this service already uses.
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_BASE_URL
        value: "https://data.alpaca.markets"

  - type: cron
    name: sigmalytic-nightly-campaign-refresh
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_nightly_campaign_refresh.py
    schedule: "15 22 * * MON-FRI"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"
      - key: SIGMALYTIC_NIGHTLY_CRON_MAX_SYMBOLS
        value: "1500"
      - key: SIGMALYTIC_NIGHTLY_CRON_BAR_LIMIT
        value: "252"
      - key: SIGMALYTIC_NIGHTLY_CRON_TIMEFRAME
        value: "DAILY"
      # NOTE (2026-08-06): SIGMALYTIC_NIGHTLY_CRON_ENABLED, _TOKEN, and
      # _TIMEOUT_SECONDS were removed from here -- confirmed via direct
      # search that tools/render_nightly_campaign_refresh.py (this
      # service's actual script) never reads any of them. All three
      # were leftover from the old, replaced HTTP-based design
      # described in that script's own docstring (it used to POST to
      # backend's /api/admin/run-full-nightly and poll for completion;
      # this service now runs the pipeline directly in its own process
      # instead). The backend service's own copies of ENABLED/TOKEN are
      # NOT removed -- that old endpoint still genuinely exists in
      # main.py and still reads them, even though this cron no longer
      # calls it.

  - type: cron
    name: sigmalytic-daily-report
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_daily_report_generator.py
    # Scheduled 30 minutes after sigmalytic-nightly-campaign-refresh
    # (22:15 UTC) so the report reflects that day's freshly-refreshed
    # campaign data, not the previous day's.
    schedule: "45 22 * * MON-FRI"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SIGMALYTIC_BACKEND_URL
        value: "https://sigmalytic-backend.onrender.com"

