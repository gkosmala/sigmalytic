name: Regression Tests

# Added 2026-07-30. Runs the regression test suite (tests/) on every
# push and pull request against main, so future changes that
# accidentally reintroduce any of the bugs fixed during the July 30
# debugging session get caught automatically, before deployment,
# instead of requiring live production discovery again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression test suite
        run: pytest tests/ -v
